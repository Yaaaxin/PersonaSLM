[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "personaslm-lab"
version = "0.1.0"
description = "Independent controlled research pipeline for persona-conditioned small language models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
personaslm = "personaslm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
cache_dir = "results/.pytest_cache"
